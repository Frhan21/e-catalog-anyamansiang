name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, pdo_mysql, bcmath, intl, gd, zip, exif

      - name: Composer install (prod)
        run: composer install --no-dev --no-interaction --prefer-dist --optimize-autoloader --no-progress

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci
      - run: npm run build

      - name: Prepare public web root
        run: |
          cp -a public .deploy-public
          sed -i "s#__DIR__.'/../storage#__DIR__.'/../e-catalog-anyamansiang/storage#; s#__DIR__.'/../vendor#__DIR__.'/../e-catalog-anyamansiang/vendor#; s#__DIR__.'/../bootstrap#__DIR__.'/../e-catalog-anyamansiang/bootstrap#" .deploy-public/index.php
          rm -f .deploy-public/storage

      - name: FTP sync project
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq lftp
          lftp -u "$FTP_USERNAME,$FTP_PASSWORD" "$FTP_SERVER" <<'EOF'
            set ssl:check-hostname no
            set ftp:ssl-allow yes
            set ftp:passive-mode yes
            mirror -R . /e-catalog-anyamansiang \
              --exclude-glob .git/ \
              --exclude-glob node_modules/ \
              --exclude-glob tests/ \
              --exclude-glob .env* \
              --exclude-glob storage/ \
              --exclude-glob public/build/ \
              --exclude-glob .github/
          EOF

      - name: FTP sync public assets
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          lftp -u "$FTP_USERNAME,$FTP_PASSWORD" "$FTP_SERVER" <<'EOF'
            set ssl:check-hostname no
            set ftp:ssl-allow yes
            set ftp:passive-mode yes
            mirror -R .deploy-public /public_html \
              --exclude-glob storage/
          EOF
