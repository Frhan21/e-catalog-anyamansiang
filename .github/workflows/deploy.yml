name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, pdo_mysql, bcmath, intl, gd, zip, exif

      - uses: actions/cache@v4
        with:
          path: vendor
          key: test-vendor-${{ runner.os }}-php83-${{ hashFiles('composer.lock') }}

      - run: composer install --no-interaction --prefer-dist --no-progress
      - run: php artisan test
      - run: ./vendor/bin/pint --test

  build:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Detect Composer changes
        id: composer-changes
        run: |
          if git rev-parse HEAD^ >/dev/null 2>&1 && git diff --quiet HEAD^ HEAD -- composer.json composer.lock; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: shivammathur/setup-php@v2
        if: steps.composer-changes.outputs.changed == 'true'
        with:
          php-version: '8.3'
          extensions: mbstring, pdo_mysql, bcmath, intl, gd, zip, exif

      - name: Build vendor archive
        if: steps.composer-changes.outputs.changed == 'true'
        run: |
          composer install --no-dev --no-interaction --prefer-dist --optimize-autoloader --no-progress
          zip -qr vendor.zip vendor

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci
      - run: npm run build

      - name: Prepare public web root
        run: |
          cp -a public .deploy-public
          sed -i "s#__DIR__.'/../storage#__DIR__.'/../e-catalog-anyamansiang/storage#; s#__DIR__.'/../vendor#__DIR__.'/../e-catalog-anyamansiang/vendor#; s#__DIR__.'/../bootstrap#__DIR__.'/../e-catalog-anyamansiang/bootstrap#" .deploy-public/index.php
          rm -f .deploy-public/storage

      - uses: actions/upload-artifact@v4
        with:
          name: production
          path: |
            .
            !.git
            !node_modules
            !tests
            !storage
            !vendor
          include-hidden-files: true
          retention-days: 1

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: production

      - name: FTP sync project
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq lftp
          lftp -u "$FTP_USERNAME,$FTP_PASSWORD" "$FTP_SERVER" <<'EOF'
            set cmd:fail-exit yes
            set net:timeout 20
            set net:max-retries 3
            set net:reconnect-interval-base 5
            set ssl:check-hostname no
            set ssl:verify-certificate no
            set ftp:ssl-allow yes
            set ftp:passive-mode yes
            mirror -R . /e-catalog-anyamansiang \
              --verbose \
              --parallel=8 \
              --exclude-glob .deploy-public/ \
              --exclude-glob .github/ \
              --exclude-glob .env*
            bye
          EOF

      - name: FTP sync public assets
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          lftp -u "$FTP_USERNAME,$FTP_PASSWORD" "$FTP_SERVER" <<'EOF'
            set cmd:fail-exit yes
            set net:timeout 20
            set net:max-retries 3
            set net:reconnect-interval-base 5
            set ssl:check-hostname no
            set ssl:verify-certificate no
            set ftp:ssl-allow yes
            set ftp:passive-mode yes
            mirror -R .deploy-public /public_html \
              --verbose \
              --parallel=8 \
              --exclude-glob storage/
            bye
          EOF

  production:
    needs: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check production
        run: curl --fail --silent --show-error --retry 3 --retry-delay 5 https://anyamansiang.id/ > /dev/null
