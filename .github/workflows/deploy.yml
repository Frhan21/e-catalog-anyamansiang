name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, pdo_mysql, bcmath, intl, gd, zip, exif

      - uses: actions/cache@v4
        id: vendor-cache
        with:
          path: vendor
          key: vendor-${{ runner.os }}-php83-${{ hashFiles('composer.lock') }}

      - name: Composer install (prod)
        if: steps.vendor-cache.outputs.cache-hit != 'true'
        run: composer install --no-dev --no-interaction --prefer-dist --optimize-autoloader --no-progress

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci
      - run: npm run build

      - name: Prepare public web root
        run: |
          cp -a public .deploy-public
          sed -i "s#__DIR__.'/../storage#__DIR__.'/../e-catalog-anyamansiang/storage#; s#__DIR__.'/../vendor#__DIR__.'/../e-catalog-anyamansiang/vendor#; s#__DIR__.'/../bootstrap#__DIR__.'/../e-catalog-anyamansiang/bootstrap#" .deploy-public/index.php
          rm -f .deploy-public/storage

      - name: FTP sync project
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq lftp
          lftp -u "$FTP_USERNAME,$FTP_PASSWORD" "$FTP_SERVER" <<'EOF'
            set cmd:fail-exit yes
            set net:timeout 20
            set net:max-retries 3
            set net:reconnect-interval-base 5
            set ssl:check-hostname no
            set ssl:verify-certificate no
            set ftp:ssl-allow yes
            set ftp:passive-mode yes
            mirror -R . /e-catalog-anyamansiang \
              --verbose \
              --parallel=8 \
              --exclude-glob .git/ \
              --exclude-glob node_modules/ \
              --exclude-glob tests/ \
              --exclude-glob .env* \
              --exclude-glob storage/ \
              --exclude-glob public/build/ \
              --exclude-glob .github/
            bye
          EOF

      - name: FTP sync public assets
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          lftp -u "$FTP_USERNAME,$FTP_PASSWORD" "$FTP_SERVER" <<'EOF'
            set cmd:fail-exit yes
            set net:timeout 20
            set net:max-retries 3
            set net:reconnect-interval-base 5
            set ssl:check-hostname no
            set ssl:verify-certificate no
            set ftp:ssl-allow yes
            set ftp:passive-mode yes
            mirror -R .deploy-public /public_html \
              --verbose \
              --parallel=8 \
              --exclude-glob storage/
            bye
          EOF
